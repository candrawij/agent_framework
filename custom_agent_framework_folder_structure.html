function fileIcon(name) {
  if (name.endsWith('.py')) return '🐍';
  if (name.endsWith('.ts') || name.endsWith('.tsx')) return '🔷';
  if (name.endsWith('.dart')) return '🎯';
  if (name.endsWith('.yaml') || name.endsWith('.yml')) return '⚙️';
  if (name.endsWith('.md')) return '📝';
  if (name.endsWith('.json')) return '📋';
  if (name.endsWith('.sh')) return '💻';
  if (name.endsWith('.kt')) return '🔶';
  if (name.endsWith('.swift')) return '🔸';
  if (name.endsWith('.env.example') || name.endsWith('.example')) return '🔐';
  if (name.endsWith('.xml')) return '📄';
  if (name.endsWith('.plist')) return '📄';
  if (name.endsWith('Makefile')) return '🔧';
  return '📄';
}

function buildNode(item, depth = 0) {
  if (item.type === 'section') {
    return `<div class="section-header ${item.cls}" data-section="${item.cls}">${item.label}</div>`;
  }
  if (item.type === 'file') {
    return `<div class="label" style="padding-left:2px">
      <span class="icon" aria-hidden="true">${fileIcon(item.name)}</span>
      <span class="file-name">${item.name}</span>
      ${item.comment ? `<span class="comment"># ${item.comment}</span>` : ''}
    </div>`;
  }
  if (item.type === 'folder') {
    const open = item.open ? 'open' : '';
    const children = (item.children || []).map(c => buildNode(c, depth+1)).join('');
    const badge = item.section ? `<span class="badge ${item.section}">${item.section}</span>` : '';
    const sec = item.section ? `data-section="${item.section}"` : '';
    return `<div class="folder ${open}" ${sec} onclick="toggleFolder(event, this)">
      <div class="label">
        <span class="chevron">▶</span>
        <span class="icon" aria-hidden="true">${open ? '📂' : '📁'}</span>
        <span class="name">${item.name}</span>
        ${badge}
        ${item.comment ? `<span class="comment">${item.comment}</span>` : ''}
      </div>
      <div class="children ${open ? '' : 'collapsed'}">${children}</div>
    </div>`;
  }
  return '';
}

document.getElementById('tree').innerHTML = data.map(d => buildNode(d)).join('');

function toggleFolder(e, el) {
  e.stopPropagation();
  const isOpen = el.classList.contains('open');
  el.classList.toggle('open', !isOpen);
  const ch = el.querySelector(':scope > .children');
  if (ch) ch.classList.toggle('collapsed', isOpen);
  const icon = el.querySelector(':scope > .label > .icon');
  if (icon) icon.textContent = isOpen ? '📁' : '📂';
}

let allOpen = false;
function toggleAll() {
  allOpen = !allOpen;
  document.querySelectorAll('.folder').forEach(el => {
    el.classList.toggle('open', allOpen);
    const ch = el.querySelector(':scope > .children');
    if (ch) ch.classList.toggle('collapsed', !allOpen);
    const icon = el.querySelector(':scope > .label > .icon');
    if (icon) icon.textContent = allOpen ? '📂' : '📁';
  });
  document.querySelector('.expand-all').textContent = allOpen ? 'tutup semua' : 'buka semua';
}

function filterSection(section, tabEl) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');

  const allItems = document.querySelectorAll('#tree > *');
  allItems.forEach(el => {
    if (section === 'all') {
      el.style.display = '';
    } else {
      const sec = el.getAttribute('data-section');
      el.style.display = (sec === section) ? '' : 'none';
    }
  });
}
