[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-framework"
version = "1.0.0"
description = "Custom Multi-Agent Framework"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ollama = ["ollama>=0.2.1"]
openai = ["openai>=1.30.0"]
chromadb = ["chromadb>=0.5.0"]
qdrant = ["qdrant-client>=1.9.0"]
search = ["duckduckgo-search>=6.0.0"]
security = ["python-jose[cryptography]>=3.3.0"]
monitoring = ["psutil>=5.9.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]
all = [
    "my-agent-framework[ollama,openai,chromadb,qdrant,search,security,monitoring]"
]

[project.scripts]
framework-server = "framework.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "model_layer*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
